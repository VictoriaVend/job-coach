[project]
name = "job_coach"
version = "0.1.0"
description = "AI-powered Job Coach backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "SQLAlchemy>=2.0",
    "alembic",
    "alembic-postgresql-enum",
    "psycopg[binary]",
    "asyncpg",
    "pydantic[email]>=2.0",
    "pydantic-settings",
    "pyjwt[crypto]",
    "bcrypt",
    "python-multipart",
    "python-dotenv",
    "slowapi",
    "structlog",
]
[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "pytest-asyncio",
    "black",
    "ruff",
    "mypy",
    "pre-commit",
    "ipython",
]
ml = [
    "langchain-huggingface",
    "langchain-text-splitters",
    "sentence-transformers",
    "qdrant-client",
    "PyMuPDF",
    "numpy",
]
infra = [
    "celery",
    "redis",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 90
target-version = ["py312"]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
